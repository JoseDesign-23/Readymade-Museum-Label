<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Readymade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1033;
      --panel: #0f0a20;
      --ink: #f4efe1;
      --accent: #ffd23f;
      --accent2: #ff4f9a;
      --accent3: #3ee6c3;
      --muted: #9a8fc2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 20px 60px;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #2c1a5e 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: "VT323", "Courier New", monospace;
      font-size: 1.35rem;
    }
    /* CRT scanlines over the whole screen */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px);
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 {
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: clamp(0.85rem, 2.4vw, 1.35rem);
      line-height: 1.7;
      color: var(--accent);
      text-shadow: 3px 3px 0 var(--accent2);
      margin: 0 0 10px;
    }
    .sub { color: var(--accent3); margin: 0 0 24px; letter-spacing: 1px; }
    form { display: flex; gap: 14px; flex-wrap: wrap; }
    input {
      flex: 1 1 240px;
      padding: 10px 14px;
      font-family: "VT323", "Courier New", monospace;
      font-size: 1.5rem;
      background: var(--panel);
      color: var(--ink);
      border: 4px solid var(--accent3);
      box-shadow: 4px 4px 0 #000;
    }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 0.8rem;
      padding: 14px 20px;
      background: var(--accent2);
      color: #1a1033;
      border: 4px solid #000;
      box-shadow: 0 6px 0 #a8286a;
      cursor: pointer;
    }
    button:hover { background: var(--accent); box-shadow: 0 6px 0 #b38f00; }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8286a; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #status {
      margin: 22px 0 8px;
      min-height: 1.4em;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #status:not(:empty)::after {
      content: "\2588";
      margin-left: 6px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #exhibit {
      display: none;
      flex-wrap: wrap;
      gap: 32px;
      margin-top: 18px;
      align-items: flex-start;
    }
    .frame {
      flex: 2 1 340px;
      padding: 10px;
      background: var(--panel);
      border: 6px solid var(--accent);
      box-shadow: 8px 8px 0 #000;
    }
    .frame img { display: block; width: 100%; height: auto; }
    #label {
      flex: 1 1 280px;
      padding: 18px;
      background: var(--ink);
      color: #1a1033;
      border: 4px solid #000;
      box-shadow: 8px 8px 0 var(--accent2);
      font-size: 1.3rem;
      line-height: 1.25;
    }
    #label p { margin: 0 0 12px; }
    #label .artist {
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      color: #a8286a;
    }
    #label .title { font-style: italic; font-size: 1.45rem; }
    #label hr { border: 0; border-top: 4px dotted #1a1033; margin: 14px 0; }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 1.1rem;
      text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      #status:not(:empty)::after { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Describe an object and get it exhibited with its label.</h1>
    <p class="sub">&#9654; Type an object, then press Accession to begin</p>

    <form id="form">
      <input id="description" placeholder="e.g. my cat Novita" maxlength="300" required>
      <button id="btn" type="submit">&#9654; Accession</button>
    </form>
    <div id="status"></div>

    <div id="exhibit">
      <div class="frame"><img id="art" alt="The object installed in an exhibition"></div>
      <div id="label"></div>
    </div>

    <footer>&copy; 2026 Museum of Ordinary Things &middot; 1 credit</footer>
  </div>

  <script>
    const form = document.getElementById("form");
    const statusBox = document.getElementById("status");
    const exhibit = document.getElementById("exhibit");
    const labelBox = document.getElementById("label");
    const art = document.getElementById("art");
    const btn = document.getElementById("btn");

    let loadingTimer = null;

    function startLoading() {
      let dots = 0;
      const base = "The curators are deliberating";
      statusBox.textContent = base;
      loadingTimer = setInterval(() => {
        dots = (dots + 1) % 4;
        statusBox.textContent = base + ".".repeat(dots);
      }, 400);
    }

    function stopLoading(message) {
      clearInterval(loadingTimer);
      statusBox.textContent = message || "";
    }

    function addLine(text, className) {
      const p = document.createElement("p");
      if (className) p.className = className;
      p.textContent = text;
      labelBox.appendChild(p);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const description = document.getElementById("description").value;
      btn.disabled = true;
      exhibit.style.display = "none";
      startLoading();

      try {
        const res = await fetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ description })
        });
        const data = await res.json();
        if (!res.ok) { stopLoading(data.error); btn.disabled = false; return; }

        const L = data.label;
        art.src = data.image;
        labelBox.innerHTML = "";
        addLine(L.artist, "artist");
        addLine(L.bio);
        addLine(L.title + ", " + L.year, "title");
        addLine(L.medium);
        addLine(L.dimensions);
        addLine(L.provenance);
        addLine(L.credit_line);
        labelBox.appendChild(document.createElement("hr"));
        addLine(L.extended_label);

        stopLoading("");
        exhibit.style.display = "flex";
      } catch (err) {
        stopLoading("Something went wrong. Please try again.");
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
